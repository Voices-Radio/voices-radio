              - paragraph [ref=f5e154]: Build and manage a sustainable music and events programme across Hackney Bridge's venue spaces, with a consistent cultural offer and one retained partner.
            - generic [ref=f5e155]:
              - paragraph [ref=f5e156]: Delivered
              - paragraph [ref=f5e157]: Voices supports programme development, promoter outreach, event sourcing, booking coordination, calendar management and marketing liaison. At Nico's, Voices creates DJ line-ups for live-music dates, weekly DJ sets, day parties and larger takeovers.
            - generic [ref=f5e158]:
              - paragraph [ref=f5e159]: Scale
              - paragraph [ref=f5e160]: The public programming relationship began with Around the World with Nico in March 2024. A formal retained promoter arrangement started in January 2025 and remains ongoing. Internal records evidence at least 17 dated bookings between 7 May and 15 July 2026.
            - generic [ref=f5e161]:
              - paragraph [ref=f5e162]: Proof point
              - paragraph [ref=f5e163]: "Hackney Bridge publicly credits Voices with creating Nico's DJ line-ups, and the weekly programme continued to be advertised as curated by Voices in 2026. Maria Hanlon presents: Soul Satisfaction was selected as a Resident Advisor Pick."
